# Value Market - Apache vhost for Cloud Run.
#
# The literal token __PORT__ is substituted by docker/entrypoint.sh at container start, from Cloud Run's
# injected $PORT (defaulting to 8080 if unset - e.g. for a plain `docker run` without Cloud Run's env).
# Templated rather than hardcoded because Apache config files don't expand shell/environment variables on
# their own.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
