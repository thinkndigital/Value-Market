# Value Market - Apache vhost for Cloud Run.
#
# The literal token __PORT__ is substituted by docker/entrypoint.sh at container start, from Cloud Run's
# injected $PORT (defaulting to 8080 if unset - e.g. for a plain `docker run` without Cloud Run's env).
# Templated rather than hardcoded because Apache config files don't expand shell/environment variables on
# their own.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Compress text-based responses (HTML/CSS/JS/JSON/SVG) - mod_deflate must also be enabled via
    # a2enmod in the Dockerfile. Without this, every Blade page and every CSS/JS asset is sent
    # uncompressed, which is a large, avoidable chunk of transfer time on real (especially mobile)
    # connections - images (already-compressed jpg/png/webp) are deliberately excluded, compressing
    # them again wastes CPU for no size benefit.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
    </IfModule>

    # Long-lived browser caching for hashed, versioned build assets (Vite output under /build/ carries a
    # content hash in its filename, so a new deploy always gets a new URL - safe to cache "forever").
    # Uploaded/user images are excluded (no hash in their filename, can be replaced in place) and get a
    # short cache instead, still avoiding a full re-fetch on every single navigation.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 week"
        ExpiresByType image/png "access plus 1 week"
        ExpiresByType image/webp "access plus 1 week"
        ExpiresByType font/woff2 "access plus 1 year"
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
