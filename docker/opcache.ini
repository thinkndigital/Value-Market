; Value Market - Opcache tuning for a stateless, ephemeral Cloud Run container. Each revision is an
; immutable image, so there's no hot-reloading PHP source on disk in production - validate_timestamps=0 is
; safe and avoids the per-request filesystem stat() cost.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=off
